<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poker Lab Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  :root { --fg:#fff; --bg:#000; --dim:#888; --red:#ff2a2a; --grn:#3ddc5a; }
  * { box-sizing: border-box; }
  html, body { overflow-x:hidden; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:"VT323", ui-monospace, Menlo, monospace; font-size:21px; line-height:1.15; }
  .wrap { max-width:1240px; margin:0 auto; padding:18px 16px 40px; }
  /* Panels: double-line frame with a title cut into the top edge (same as index.html). */
  .box { border:3px double var(--fg); padding:16px 16px 12px; margin:14px 0 16px; position:relative; min-width:0; }
  .box[data-t]::before { content:"[ " attr(data-t) " ]"; position:absolute; top:-13px; left:12px; background:var(--bg); padding:0 6px; color:var(--dim); font-size:19px; line-height:22px; }
  h1 { font-size:34px; margin:0; letter-spacing:2px; font-weight:normal; }
  .sub, .dim { color:var(--dim); }
  .btn { --c:#fff; background:#000; color:var(--c); border:2px solid var(--c); font:inherit; font-size:24px; padding:1px 14px; cursor:pointer; margin:8px 8px 0 0; text-decoration:none; display:inline-block; }
  .btn:hover, .btn.sel { background:var(--c); color:#000; }
  .btn.small { font-size:20px; padding:0 10px; }
  .btn:disabled { cursor:default; }
  .btn:disabled:not(.sel) { --c:#555; }
  .btn:disabled:hover:not(.sel) { background:#000; color:var(--c); }
  .btn .k { color:var(--dim); }
  .btn:hover .k, .btn.sel .k { color:#000; }
  .head { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; }
  .grid2 { display:grid; grid-template-columns: minmax(0,1fr) 320px; gap:16px; align-items:start; }
  @media (max-width: 900px) { .grid2 { grid-template-columns: minmax(0,1fr); } }
  .err { color:var(--red); }
  .good { color:var(--grn); }
  .s-h, .s-d { color:var(--red); }
  .hide { display:none !important; }

  /* Table */
  .felt { border:1px solid #555; padding:14px 10px; text-align:center; }
  .seat { display:flex; justify-content:center; align-items:center; gap:14px; flex-wrap:wrap; }
  .pos { border:2px solid #fff; padding:0 8px; font-size:24px; }
  .pos.hero { background:#fff; color:#000; }
  .dbtn { border:1px solid #fff; border-radius:50%; width:24px; height:24px; line-height:22px; font-size:18px; display:inline-block; text-align:center; }
  .stack { font-size:24px; }
  .who { color:var(--dim); }
  .pc { display:inline-block; border:2px solid #fff; min-width:46px; padding:2px 4px; font-size:30px; text-align:center; margin:0 2px; background:#000; }
  .pc.down { color:#555; border-color:#777; }
  .hc { white-space:nowrap; }
  @media (max-width: 520px) {
    .seat { gap:8px; }
    .pc { min-width:34px; font-size:24px; padding:1px 2px; }
    .pos, .stack, .pot, .last { font-size:21px; }
  }
  .chips { color:var(--fg); min-height:24px; margin:6px 0; }
  .mid { margin:14px 0; }
  .pot { margin-top:6px; font-size:24px; }
  .story { white-space:pre-wrap; color:var(--dim); margin-top:12px; }
  .story b { color:#fff; font-weight:normal; }
  .last { margin-top:8px; background:#fff; color:#000; padding:2px 8px; font-size:24px; display:inline-block; }

  /* Actions and feedback */
  .acts { display:flex; flex-wrap:wrap; }
  .grade { font-size:34px; letter-spacing:2px; }
  .rows { margin-top:10px; overflow-x:auto; }
  .row { white-space:pre; padding:0 4px; }
  .row.me { background:#fff; color:#000; }
  .row.me .dim { color:#333; }
  .expl { margin-top:10px; white-space:pre-wrap; }
  .stats { white-space:pre-wrap; }
  .note { white-space:pre-wrap; }
  .log { white-space:pre-wrap; }
  .log .now { background:#fff; color:#000; padding:0 6px; }
  #handEnd:not(:empty) { margin-top:10px; }
  a { color:#fff; }

  /* Intro replay: earlier streets and actions appear in order (see playIntro). */
  #table .st { opacity:0; }
  #table .pc.st { transform:translateY(-8px); }
  #table .st.on { opacity:1; transform:none; transition:opacity .22s ease var(--d, 0ms), transform .22s ease var(--d, 0ms); }
  #actbox { transition:opacity .25s; }
  #actbox.waiting { opacity:.35; pointer-events:none; }
  @media (prefers-reduced-motion: reduce) { #table .st { opacity:1; transform:none; transition:none; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="box">
    <div class="head">
      <div>
        <h1>POKER LAB · TRAINER</h1>
        <div class="sub" id="dbline">&gt; Play one decision. See the solver answer at once.</div>
      </div>
      <a class="btn small" href="/" style="margin-top:4px">&lt; SOLVER</a>
    </div>
    <div id="cats"></div>
  </div>

  <div class="grid2">
    <div>
      <div class="box" data-t="table" id="tablebox">
        <div class="note" id="spotline">&gt; Loading a spot...</div>
        <div id="table"></div>
      </div>
      <div class="box hide" data-t="hand log" id="logbox">
        <div class="log" id="log"></div>
        <div class="log" id="handEnd"></div>
      </div>
      <div class="box" data-t="your action" id="actbox">
        <div class="acts" id="acts"></div>
        <div class="dim" id="keys" style="margin-top:8px"></div>
      </div>
      <div class="box hide" data-t="solver answer" id="answer">
        <div id="gradeLine"></div>
        <div class="rows" id="rows"></div>
        <div class="expl" id="expl"></div>
        <button class="btn hide" id="cont">CONTINUE <span class="k">[ENTER]</span></button><button class="btn" id="next">NEXT <span class="k" id="nextKey">[ENTER]</span></button>
      </div>
    </div>
    <div>
      <div class="box" data-t="session">
        <div class="stats" id="stats"></div>
        <button class="btn small" id="reset">RESET</button>
      </div>
      <div class="box" data-t="grades">
        <div class="stats dim" id="legend"></div>
      </div>
    </div>
  </div>
</div>

<script>
// ===== Settings =====
// Grade rules. "freq" = GTO frequency of the chosen action for this hand (0..1).
// "loss" = EV loss of the chosen action in % of the current pot.
const GRADE = {
  BEST:       { freq: 0.5, loss: 0.5 },  // freq >= 0.5 or loss < 0.5%
  CORRECT:    { freq: 0.1, loss: 2 },    // freq >= 0.1 or loss < 2%
  INACCURACY: { loss: 5 },               // loss < 5%
  MISTAKE:    { loss: 15 },              // loss < 15%; else BLUNDER
};
const GOOD_GRADES = ["BEST", "CORRECT"];
const CATEGORIES = [["any", "ANY"], ["mixed", "MIXED"], ["ev_loss", "EV LOSS"], ["bluff", "BLUFF"], ["fundamental", "FUNDAMENTALS"]];
// Sample spots, used when the server has no /api/play routes.
const FIXTURES = ["spot_river_bb_first.json", "spot_river_btn_vs_check.json", "spot_river_btn_vs_bet.json"];
const RECENT_MAX = 30;
const LS_SESSION = "pokerlab_play_session", LS_RECENT = "pokerlab_play_recent", LS_CAT = "pokerlab_play_cat";

// ===== Helpers =====
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const SUIT = { c:"♣", d:"♦", h:"♥", s:"♠" };
const cardHtml = c => `<span class="pc"><span class="s-${c[1]}">${c[0]}${SUIT[c[1]]}</span></span>`;
const cardsOf = str => str.match(/[2-9TJQKA][cdhs]/g) || [];
const suitText = str => str.replace(/([2-9TJQKA])([cdhs])/g, (m, r, s) => `<span class="s-${s}">${r}${SUIT[s]}</span>`);
const bb = v => { const d = v !== 0 && Math.abs(v) < 0.1 ? 1000 : 100; return (Math.round(v * d) / d).toString(); };
const pct = v => (v * 100).toFixed(0) + "%";
const bar = (f, w) => { const n = Math.max(0, Math.min(w, Math.round(f * w))); return "█".repeat(n) + "░".repeat(w - n); };
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

// "Bet 1.82" -> {kind:"Bet", amt:1.82}. Amounts are chips ADDED by the action.
function parseAct(label) {
  const [kind, a] = label.split(" ");
  return { kind, amt: a ? parseFloat(a) : 0 };
}
const isAggro = k => k === "Bet" || k === "Raise" || k === "All-in";

// ===== State =====
let cat = lsGet(LS_CAT, "any");
let recent = lsGet(LS_RECENT, []);
let session = lsGet(LS_SESSION, null) || newSession();
let spot = null, ctx = null, hand = null, result = null, offline = false;
let samplesOnly = false;   // set by SAMPLE SPOTS after a server error; lasts until reload
let hs = null;             // the hand in play (see startHand); null = single decision only
let gen = 0;               // bumped by every new spot; a running hand resolver stops when it changes
let busy = false;          // the resolver is working (villain acts, cards come)
const STEP_MS = 500;       // pause before each villain action or new card
function newSession() { return { played: 0, good: 0, evLost: 0, grades: {}, cats: {}, hands: 0 }; }

// ===== Loading =====
async function fetchJson(url) {
  const r = await fetch(url, { cache: "no-store" });
  const type = r.headers.get("content-type") || "";
  if (!type.includes("json")) throw new Error("not json");   // static server: 404 page
  return r.json();
}
async function loadFixture() {
  const pool = [];
  for (const f of FIXTURES) pool.push(fetchJson("fixtures/" + f).catch(() => null));
  const all = (await Promise.all(pool)).filter(s => s && s.node);
  if (!all.length) throw new Error("no sample spots found in web/fixtures/");
  let cand = all.filter(s => !recent.includes(s.id));
  if (cat !== "any" && cand.some(s => s.category === cat)) cand = cand.filter(s => s.category === cat);
  if (!cand.length) cand = all.filter(s => s.id !== recent[recent.length - 1]);
  if (!cand.length) cand = all;
  return cand[Math.floor(Math.random() * cand.length)];
}
async function loadSpot() {
  if (document.activeElement) document.activeElement.blur();
  const g = ++gen; busy = false; hs = null;
  $("answer").classList.add("hide");
  $("logbox").classList.add("hide");
  $("acts").innerHTML = ""; $("keys").textContent = "";
  $("spotline").textContent = "> Loading a spot...";
  $("table").innerHTML = "";
  result = null;
  let s = null;
  try {
    if (samplesOnly) throw new Error("samples");
    s = await fetchJson(`/api/play/spot?category=${encodeURIComponent(cat)}&exclude=${encodeURIComponent(recent.join(","))}`);
    offline = false;
  } catch (e) {
    offline = true;
  }
  try {
    if (offline) s = await loadFixture();
  } catch (e) { return showError(e.message); }
  if (g !== gen) return;   // a newer request took over
  if (s.error) return showError(s.error);
  if (!s.node || s.node.type !== "action" || !s.node.hands) return showError("the spot has no decision node (type " + (s.node && s.node.type) + ")");
  spot = s;
  recent = recent.filter(id => id !== s.id).concat([s.id]).slice(-RECENT_MAX);
  lsSet(LS_RECENT, recent);
  ctx = buildContext(s);
  hand = dealHand(s.node, cat === "any" ? s.category : cat);
  if (!hand) return showError("no hand in this range reaches the spot");
  hs = startHand(s, hand);
  render();
}
function showError(msg) {
  spot = null;
  $("spotline").innerHTML = `<span class="err">&gt; ${esc(msg)}</span>\n&gt; Fill the spot database, or practice with the sample spots.`;
  $("table").innerHTML = "";
  $("acts").innerHTML = `<button class="btn" id="retry">RETRY</button><button class="btn" id="sample">SAMPLE SPOTS</button>`;
  $("retry").onclick = loadSpot;
  $("sample").onclick = () => { samplesOnly = true; loadSpot(); };
}
async function loadStats() {
  try {
    const st = await fetchJson("/api/play/stats");
    if (st && typeof st.spots === "number") {
      const parts = Object.entries(st.by_category || {}).map(([k, v]) => `${k.replace("_", " ")} ${v}`);
      $("dbline").textContent = `> Database: ${st.spots} spots` + (parts.length ? ` (${parts.join(", ")})` : "") + ".";
    }
  } catch (e) { /* stats are optional */ }
}

// ===== Spot context: replay this street's history =====
// Returns names, the street start pot, stacks behind, and one text per action.
function buildContext(s) {
  const n = s.node;
  const name = p => p === 0 ? s.oop_pos : s.ip_pos;
  // Only actions after the last dealt card belong to this street.
  let start = 0;
  n.history.forEach((h, i) => { if (h.startsWith("deal ")) start = i + 1; });
  const street = n.history.slice(start).map(h => { const sp = h.indexOf(" "); return { p: h.slice(0, sp) === "OOP" ? 0 : 1, ...parseAct(h.slice(sp + 1)) }; });
  const startPot = n.pot - street.reduce((a, e) => a + e.amt, 0);
  const put = [0, 0];        // chips each player put in on this street
  let pot = startPot;
  const lines = street.map(e => {
    const toCall = Math.max(0, put[1 - e.p] - put[e.p]);
    const t = describe(e.kind, e.amt, pot, toCall, put[e.p]);
    put[e.p] += e.amt; pot += e.amt;
    return { p: e.p, text: `${name(e.p)} ${t.verb}` };
  });
  const hero = n.player, opp = 1 - hero;
  // s.pot / s.stack are the solve's starting values (not this street's), so this also holds for
  // river spots that continue a turn solve.
  const behind = p => s.stack + s.pot / 2 - n.contrib[p];
  return { name, hero, opp, startPot, put, lines, behind, toCall: Math.max(0, n.contrib[opp] - n.contrib[hero]) };
}
// Text for one action. pot = pot before the action; put = chips this player already put in on this street.
function describe(kind, amt, pot, toCall, put) {
  if (kind === "Check") return { verb: "checks", short: "CHECK" };
  if (kind === "Fold") return { verb: "folds", short: "FOLD" };
  if (kind === "Call") return { verb: `calls ${bb(amt)} bb`, short: `CALL ${bb(amt)} bb` };
  // Bets: % of the pot. Raises: raise part in % of the pot after the call (the solver's rule).
  const size = toCall > 0 ? (amt - toCall) / (pot + toCall) : amt / pot;
  const p = `${(size * 100).toFixed(0)}% pot`;
  if (kind === "Bet") return { verb: `bets ${bb(amt)} bb (${p})`, short: `BET ${bb(amt)} bb`, size: p };
  if (kind === "Raise") return { verb: `raises to ${bb(put + amt)} bb (${p})`, short: `RAISE TO ${bb(put + amt)} bb`, size: p };
  return { verb: `goes all-in, ${bb(amt)} bb`, short: `ALL-IN ${bb(amt)} bb` };
}
function heroActions() {
  const n = spot.node;
  return n.actions.map(a => { const x = parseAct(a); return describe(x.kind, x.amt, n.pot, ctx.toCall, ctx.put[ctx.hero]); });
}

// ===== Deal the hero a hand =====
// Weighted by reach; prefer hands that fit the category, else any hand.
function dealHand(n, category) {
  const kinds = n.actions.map(a => parseAct(a).kind);
  // Skip uncontested hands: a hand that folds at least 90% is trash with nothing to decide. Fall back to
  // every hand only if the spot has no other hand.
  const foldIdx = kinds.indexOf("Fold");
  const live0 = n.hands.filter(h => h.w > 1e-3);
  const live1 = foldIdx < 0 ? live0 : live0.filter(h => h.s[foldIdx] < 0.9);
  const live = live1.length ? live1 : live0;
  if (!live.length) return null;
  const top = h => Math.max(...h.s);
  const fits = {
    mixed: h => top(h) < 0.7,
    fundamental: h => top(h) > 0.9,
    // Big EV spread: best EV minus the worst non-all-in action, at least 15% of the pot.
    ev_loss: h => Math.max(...h.ev) - Math.min(...h.ev.filter((v, i) => kinds[i] !== "All-in" || kinds.every(k => k === "All-in"))) >= 0.15 * n.pot,
    // Low EV, but bets or raises often.
    bluff: h => h.e < 0.25 * n.pot && h.s.reduce((a, f, i) => a + (isAggro(kinds[i]) ? f : 0), 0) >= 0.3,
  }[category];
  let pool = fits ? live.filter(fits) : live;
  if (!pool.length) pool = live;
  const W = pool.reduce((a, h) => a + h.w, 0);
  let r = Math.random() * W;
  for (const h of pool) { r -= h.w; if (r <= 0) return h; }
  return pool[pool.length - 1];
}

// ===== Render the table =====
function render() {
  const s = spot, n = s.node, c = ctx;
  const heroName = c.name(c.hero), oppName = c.name(c.opp);
  const streetName = (s.street || "").toUpperCase();
  $("spotline").innerHTML = `&gt; #${esc(s.id)} · ${esc(s.preset || "")} · ${esc(streetName)}` +
    (s.category ? ` · ${esc(s.category.replace("_", " "))}` : "") +
    (hs && hs.decisions.length ? ` <span class="dim">· same hand, decision ${hs.decisions.length + 1}</span>` : "") +
    (offline ? ` <span class="dim">· sample spot (no server data)</span>` : "");
  // Story: earlier streets (from the server), then this street.
  const board = cardsOf(n.board);
  const lastCard = board[board.length - 1];
  const streetLine = `${(s.street || "street").replace(/^./, m => m.toUpperCase())}${s.street === "flop" ? " " + board.slice(0, 3).join("") : " " + lastCard}: ` +
    (c.lines.length ? c.lines.map(l => l.text).join(", ") : `${heroName} to act`);
  // The server story ends with the bare card of this street ("River Qc"); the street line below repeats it with the actions.
  // Intro steps: 0 = hole cards, then for each story line its street head (with that street's board cards) and
  // each action in turn, then `last` = pot, last action and the action buttons.
  const raw = (s.story || []).filter(l => !/^(Flop|Turn|River) [^:]*$/.test(l)).concat([streetLine]);
  let step = 1, curStep = 1;
  const cardStep = {};   // board index -> step
  const story = raw.map((l, li) => {
    const m = l.match(/^([^:]*:)\s*(.*)$/) || [null, l, ""];
    const head = step++;
    const st = (m[1].match(/^(Flop|Turn|River)/) || [])[1];
    if (st === "Flop") [0, 1, 2].forEach(i => cardStep[i] = head);
    if (st === "Turn") cardStep[3] = head;
    if (st === "River") cardStep[4] = head;
    if (li === raw.length - 1) curStep = head;
    const parts = m[2] ? m[2].split(/, (?=(?:BTN|BB|SB|CO|UTG|HJ|LJ|MP|All)\b)/) : [];
    const html = `<span class="st sh" data-st="${head}">${suitText(esc(m[1]))}</span>` +
      parts.map((p, k) => `<span class="st" data-st="${step++}">${k ? ", " : " "}${suitText(esc(p))}</span>`).join("");
    return li === raw.length - 1 ? `<b>${html}</b>` : html;
  }).join("\n");
  const lastStep = step;
  const last = c.lines[c.lines.length - 1];
  const lastHtml = last && last.p === c.opp
    ? `<div class="last">&gt; ${esc(last.text)}</div>`
    : `<div class="last">&gt; ${esc(oppName)} has not acted on the ${esc(s.street || "street")}. You act first.</div>`;
  $("table").innerHTML =
    `<div id="felt">${feltHtml({ hero: c.hero, name: c.name, behind: c.behind, put: c.put, board, pot: n.pot, heroCards: hand.c, oppCards: null })}</div>` +
    `<div class="story">${story}</div><div id="lastLine">${lastHtml}</div>` +
    `<div class="dim" style="margin-top:8px">&gt; You are ${esc(heroName)} (${c.hero === 0 ? "out of position" : "in position"}). Amounts in big blinds.</div>`;
  const felt = $("felt");
  felt.querySelectorAll(".hc .pc").forEach((e, i) => { e.classList.add("st"); e.dataset.st = 0; e.style.setProperty("--d", `${(i % 2) * 70}ms`); });
  felt.querySelectorAll(".mid > .pc").forEach((e, i) => {
    e.classList.add("st"); e.dataset.st = cardStep[i] != null ? cardStep[i] : 0;
    if (i < 3) e.style.setProperty("--d", `${i * 90}ms`);
  });
  felt.querySelectorAll(".pot, .chips").forEach(e => { e.classList.add("st"); e.dataset.st = lastStep; });
  $("lastLine").classList.add("st"); $("lastLine").dataset.st = lastStep;
  // A fresh spot replays the whole hand; a later decision of the same hand replays only the new street.
  playIntro(hs && hs.decisions.length ? curStep : 0, lastStep);
  const acts = heroActions();
  $("acts").innerHTML = acts.map((a, i) =>
    `<button class="btn" data-i="${i}"><span class="k">${i + 1}</span> ${esc(a.short)}${a.size ? ` <span class="k">${esc(a.size)}</span>` : ""}</button>`).join("");
  $("acts").querySelectorAll(".btn").forEach(b => b.onclick = () => choose(+b.dataset.i));
  $("keys").textContent = `> Keys 1-${acts.length} choose an action.`;
  renderLog();
}
// ===== Intro: deal the earlier streets and actions again, one step at a time =====
// Elements with data-st="k" appear at step k. A click on the table or any key skips to the end.
const INTRO_MS = { head: 300, act: 190 };
let intro = null;
function stopIntro() { if (intro) { clearTimeout(intro.t); intro.done(); } }
function playIntro(from, last) {
  stopIntro();
  const els = [...$("table").querySelectorAll("[data-st]")];
  const heads = new Set([...$("table").querySelectorAll(".sh")].map(e => +e.dataset.st));
  const show = k => els.forEach(e => { if (+e.dataset.st <= k) e.classList.add("on"); });
  const box = $("actbox");
  const done = () => { intro = null; show(last); box.classList.remove("waiting"); };
  show(from - 1);
  if (from >= last || matchMedia("(prefers-reduced-motion: reduce)").matches) return done();
  box.classList.add("waiting");
  let k = from;
  intro = { t: 0, done };
  const tick = () => {
    show(k);
    if (k >= last) return done();
    k++;
    intro.t = setTimeout(tick, heads.has(k) || k === last ? INTRO_MS.head : INTRO_MS.act);
  };
  intro.t = setTimeout(tick, 120);
}
$("tablebox").addEventListener("click", stopIntro);

// The felt: villain seat, board and pot, hero seat. o.oppCards = null keeps the villain's cards face down.
function feltHtml(o) {
  const opp = 1 - o.hero;
  const dealer = p => o.name(p) === "BTN" ? ` <span class="dbtn" title="dealer button">D</span>` : "";
  const down = `<span class="pc down">▒▒</span><span class="pc down">▒▒</span>`;
  const seat = p => {
    const isHero = p === o.hero, cards = isHero ? o.heroCards : o.oppCards;
    const cardsHtml = `<span class="hc">` + (cards ? cardsOf(cards).map(cardHtml).join("") : down) + `</span>`;
    return `<div class="seat"><span class="pos ${isHero ? "hero" : ""}">${esc(o.name(p))}</span>${dealer(p)}` +
      `<span class="stack">${bb(Math.max(0, o.behind(p)))} bb</span><span class="who">${isHero ? "YOU" : (p === 0 ? "OOP" : "IP")}</span>${cardsHtml}</div>`;
  };
  const chip = p => o.put[p] > 0.005 ? `in front: ${bb(o.put[p])} bb` : "";
  return `<div class="felt">${seat(opp)}<div class="chips">${chip(opp)}</div>` +
    `<div class="mid">${o.board.map(cardHtml).join("")}<div class="pot">POT ${bb(o.pot)} bb</div></div>` +
    `<div class="chips">${chip(o.hero)}</div>${seat(o.hero)}</div>`;
}

// ===== Grade =====
function gradeOf(freq, lossPct) {
  if (freq >= GRADE.BEST.freq || lossPct < GRADE.BEST.loss) return "BEST";
  if (freq >= GRADE.CORRECT.freq || lossPct < GRADE.CORRECT.loss) return "CORRECT";
  if (lossPct < GRADE.INACCURACY.loss) return "INACCURACY";
  if (lossPct < GRADE.MISTAKE.loss) return "MISTAKE";
  return "BLUNDER";
}
function choose(i) {
  if (!spot || result) return;
  if (document.activeElement) document.activeElement.blur();   // so ENTER/SPACE never re-click a button
  const n = spot.node, h = hand;
  let best = 0;
  h.ev.forEach((v, k) => { if (v > h.ev[best]) best = k; });
  const loss = Math.max(0, h.ev[best] - h.ev[i]);
  const lossPct = loss / n.pot * 100;
  const grade = gradeOf(h.s[i], lossPct);
  result = { i, best, loss, lossPct, grade };
  // Session
  const good = GOOD_GRADES.includes(grade);
  session.played++; if (good) session.good++;
  session.evLost += loss;
  session.grades[grade] = (session.grades[grade] || 0) + 1;
  const k = spot.category || "other";
  const cc = session.cats[k] || (session.cats[k] = { n: 0, good: 0 });
  cc.n++; if (good) cc.good++;
  lsSet(LS_SESSION, session);
  renderStats();
  if (hs) {
    hs.decisions.push({ street: spot.street, act: heroActions()[i].short, grade, loss, lossPct });
    hs.evLost += loss;
  }
  $("acts").querySelectorAll(".btn").forEach(b => { b.disabled = true; b.classList.toggle("sel", +b.dataset.i === i); });
  $("answer").classList.remove("hide");   // visible first, so the rows can be measured
  renderAnswer();
  setButtons();
  $("answer").scrollIntoView({ block: "nearest", behavior: "smooth" });
}

// ===== Show the solver answer =====
function renderAnswer() {
  if (!result) return;
  const n = spot.node, h = hand, r = result;
  const acts = heroActions();
  const good = GOOD_GRADES.includes(r.grade);
  const cls = good ? "good" : r.grade === "INACCURACY" ? "" : "err";
  $("gradeLine").innerHTML =
    `<div class="grade ${cls}">${r.grade}</div>` +
    `<div>&gt; You: ${esc(acts[r.i].short)}. Best EV: ${esc(acts[r.best].short)} (${bb(h.ev[r.best])} bb).</div>` +
    `<div>&gt; EV loss: ${bb(r.loss)} bb = ${r.lossPct.toFixed(1)}% of the pot.</div>`;
  // Layout in characters; a narrow screen gets two lines per action.
  const wpx = $("rows").clientWidth || 300;
  const chars = Math.floor(wpx / charWidth());
  const nameW = Math.max(...acts.map(a => (a.short + (a.size ? " " + a.size : "")).length)) + 1;
  const wide = chars >= nameW + 12 + 35;
  // Narrow rows: " all your hands " (16) + bar + " 100%" (5), plus 1 spare.
  const barW = Math.max(6, Math.min(24, wide ? chars - nameW - 35 : chars - 22));
  let html = "";
  if (wide) html += `<div class="row dim">${"ACTION".padEnd(nameW)}${"HOW OFTEN GTO DOES IT".padEnd(barW + 6)}${"EV bb".padStart(7)}${"LOSS".padStart(8)}</div>`;
  acts.forEach((a, k) => {
    const label = (a.short + (a.size ? " " + a.size : ""));
    const lossK = h.ev[r.best] - h.ev[k];
    const lossTxt = k === r.best ? "best" : lossK < 0.0005 ? "0" : "-" + bb(lossK);
    const me = k === r.i ? " me" : "";
    if (wide) {
      html += `<div class="row${me}">${esc(label.padEnd(nameW))}${bar(h.s[k], barW)} ${pct(h.s[k]).padStart(4)} ${bb(h.ev[k]).padStart(7)}${lossTxt.padStart(8)}  <span class="dim">your cards</span></div>`;
      html += `<div class="row dim${me}">${" ".repeat(nameW)}${bar(n.freq[k], barW)} ${pct(n.freq[k]).padStart(4)}${" ".repeat(15)}all your hands</div>`;
    } else {
      html += `<div class="row${me}">${esc(a.short)}  EV ${bb(h.ev[k])}  ${lossTxt}</div>`;
      html += `<div class="row${me}"> your cards     ${bar(h.s[k], barW)} ${pct(h.s[k]).padStart(4)}</div>`;
      html += `<div class="row dim${me}"> all your hands ${bar(n.freq[k], barW)} ${pct(n.freq[k]).padStart(4)}</div>`;
    }
  });
  const hc = suitText(esc(h.c));
  html += `<div class="dim" style="margin-top:8px;white-space:pre-wrap">&gt; Your cards: how often GTO takes each action with ${hc}. Your grade uses this line.\n` +
    `&gt; All your hands: the same, averaged over every hand you could hold here. It shows the overall plan.</div>`;
  $("rows").innerHTML = html;
  $("expl").textContent = explain(acts, h, r);
}
// Width of one character of the row font, measured once.
let cw = 0;
function charWidth() {
  if (cw) return cw;
  const m = document.createElement("span");
  m.className = "row"; m.style.cssText = "position:absolute; visibility:hidden"; m.textContent = "0░█".repeat(14);
  $("rows").appendChild(m); const w = m.getBoundingClientRect().width / 42; m.remove();
  if (w > 0 && (!document.fonts || document.fonts.status === "loaded")) cw = w;   // cache only after the font loads
  return w || 10;
}
// One plain line built only from the numbers.
function explain(acts, h, r) {
  const low = a => a.short.toLowerCase().replace(" bb", "");
  const order = acts.map((a, k) => k).filter(k => h.s[k] >= 0.05).sort((a, b) => h.s[b] - h.s[a]);
  const top = order[0];
  let s = h.s[top] >= 0.95
    ? `> GTO plays ${hand.c} one way: ${low(acts[top])} ${pct(h.s[top])}.`
    : `> GTO mixes ${hand.c}: ` + order.map(k => `${low(acts[k])} ${pct(h.s[k])}`).join(", ") + ".";
  s += r.i === r.best
    ? ` Your ${low(acts[r.i])} has the highest EV.`
    : ` Your ${low(acts[r.i])} loses ${bb(r.loss)} bb (${r.lossPct.toFixed(1)}% of the pot).`;
  if (top !== r.best && h.ev[r.best] - h.ev[top] < 0.005 * spot.node.pot)
    s += `\n> ${low(acts[top])} and ${low(acts[r.best])} have almost the same EV (gap ${bb(h.ev[r.best] - h.ev[top])} bb).`;
  return s;
}

// ===== Play the hand out =====
// After each graded decision, CONTINUE plays the villain's GTO actions (from the stored nodes),
// deals the next street (from the cards stored for the line) and stops at the hero's next decision,
// until a fold, a showdown, or a line that is not stored.
const sleep = ms => new Promise(r => setTimeout(r, ms));
const cap = s => String(s).replace(/^./, m => m.toUpperCase());
const comboKey = c => cardsOf(c).sort().join("");
const joinPath = (p, t) => p === "" ? String(t) : p + "," + t;
const NOT_STORED = "this line is not stored yet — hand ends here";
function pickWeighted(items, weight) {
  const W = items.reduce((a, x) => a + Math.max(0, weight(x)), 0);
  if (!(W > 0)) return null;
  let r = Math.random() * W;
  for (const x of items) { r -= Math.max(0, weight(x)); if (r <= 0) return x; }
  return items[items.length - 1];
}
const streetTitle = (street, board) => street === "flop" ? `Flop ${board.slice(0, 3).join("")}` : `${cap(street || "street")} ${board[board.length - 1]}`;
const hsBehind = p => hs.stack0 + hs.pot0 / 2 - hs.contrib[p];

// ===== Villain range =====
// hs.vr = the villain's range for the line played so far: [{c, w}], w = how often the villain has
// combo c here. At a hero node it is the stored node.opp; at a villain node it is each villain
// hand's weight times how often that hand takes the action played. A new card removes the combos
// that hold it. Combos that hold the hero's cards are removed too (the hero can see them).
const liveRange = (list, dead) => { const d = new Set(dead); return list.filter(o => o.w > 0 && !cardsOf(o.c).some(c => d.has(c))).map(o => ({ c: o.c, w: o.w })); };
function rangeAfterVillain(n, k) {
  const dead = cardsOf(hs.H).concat(hs.board);
  return liveRange(n.hands.map(h => ({ c: h.c, w: h.w * ((h.s && h.s[k]) || 0) })), dead);
}
const CAT_ORDER = ["straight flush", "quads", "full house", "flush", "straight", "trips", "two pair", "pair", "high card"];
const RANKS = "23456789TJQKA";
function handClass(c) {   // "AhKh" -> "AKs", "9c9d" -> "99"
  const [a, b] = cardsOf(c).sort((x, y) => RANKS.indexOf(y[0]) - RANKS.indexOf(x[0]));
  return a[0] === b[0] ? a[0] + b[0] : a[0] + b[0] + (a[1] === b[1] ? "s" : "o");
}
// Lines for the hand summary: the villain's range for this line, by made hand, and the most likely hands.
async function rangeLines(h) {
  const vr = (h.vr || []).filter(o => o.w > 1e-4);
  const total = vr.reduce((a, o) => a + o.w, 0);
  if (!vr.length || !(total > 1e-3)) return [`<span class="dim">&gt; Villain range: this line is too rare to show (weight rounds to 0).</span>`];
  let r;
  try {
    r = await fetchJson(`/api/play/range?board=${h.board.join("")}&hero=${h.H}&combos=${vr.map(o => o.c).join(",")}`);
  } catch { r = null; }
  if (!r || r.error || !Array.isArray(r.cat) || r.cat.length !== vr.length) return [`<span class="dim">&gt; Villain range: not available (${esc((r && r.error) || "no answer")}).</span>`];
  const byCat = {};
  vr.forEach((o, i) => { byCat[r.cat[i]] = (byCat[r.cat[i]] || 0) + o.w; });
  const lines = ["", `VILLAIN RANGE FOR THIS LINE (about ${Math.max(1, Math.round(total))} combo${Math.round(total) > 1 ? "s" : ""}${h.vFolded ? ", the hands that fold here" : ""})`];
  for (const cat of CAT_ORDER) {
    const p = (byCat[cat] || 0) / total;
    if (p < 0.005) continue;
    const bar = "█".repeat(Math.round(p * 20)).padEnd(20, "░");
    lines.push(`  ${cat.padEnd(15)}${(Math.round(p * 100) + "%").padStart(4)}  ${bar}`);
  }
  if (h.assumed) lines.push(`  <span class="dim">The villain's reply to the all-in is not stored: this is its range before that reply.</span>`);
  if (Array.isArray(r.vs)) {
    const beat = vr.reduce((a, o, i) => a + (r.vs[i] < 0 ? o.w : r.vs[i] === 0 ? o.w / 2 : 0), 0) / total;
    lines.push(`  Your hand (${esc(r.hero)}) beats ${Math.round(beat * 100)}% of this range (ties count half).`);
  }
  const byClass = {};
  vr.forEach(o => { const k = handClass(o.c); byClass[k] = (byClass[k] || 0) + o.w; });
  const top = Object.entries(byClass).sort((a, b) => b[1] - a[1]).slice(0, 8);
  lines.push(`  Most likely: ${top.map(([k, w]) => `${k} ${Math.round(w / total * 100)}%`).join(", ")}`);
  if (h.V) {
    const i = vr.findIndex(o => comboKey(o.c) === comboKey(h.V));
    lines.push(`  Villain's real hand ${suitText(h.V)}` + (i >= 0 ? ` (${esc(r.cat[i])}) is one of these combos.` : " is a rare combo for this line."));
  }
  return lines;
}

// A new hand for this spot: the villain gets a hidden hand from the stored range (node.opp).
function startHand(s, h) {
  const n = s.node, board = cardsOf(n.board);
  const dead = new Set(cardsOf(h.c).concat(board));
  let V = null, oppNote = "";
  if (Array.isArray(n.opp) && s.solve_id != null && s.path != null) {
    const live = n.opp.filter(o => !cardsOf(o.c).some(c => dead.has(c)));
    let o = pickWeighted(live, o => o.w);
    // A line the villain almost never takes: every weight rounds to 0. Pick any listed combo.
    if (!o && live.length) { o = live[Math.floor(Math.random() * live.length)]; oppNote = "villain reaches this spot almost never (weights round to 0): its hand is any combo of the stored range"; }
    if (o) V = o.c;
  }
  const lastHist = n.history[n.history.length - 1] || "";
  const vr = V && Array.isArray(n.opp) ? liveRange(n.opp, cardsOf(h.c).concat(board)) : null;
  return {
    solve: s.solve_id, path: s.path || "", heroP: n.player, H: h.c, V, vr, oppNote, name: ctx.name,
    pot0: s.pot, stack0: s.stack, pot: n.pot, contrib: n.contrib.slice(), put: ctx.put.slice(),
    allin: / All-in /.test(lastHist + " "), board, street: s.street,
    log: [{ title: streetTitle(s.street, board), acts: ctx.lines.map(l => l.text) }],
    last: null, decisions: [], evLost: 0, over: false, endLines: null,
  };
}
const canContinue = () => !!(hs && hs.V && !hs.over && !hs.pending && result && !busy);
function setButtons() {
  const cont = canContinue();
  $("cont").classList.toggle("hide", !cont);
  $("nextKey").textContent = cont ? "[N]" : "[ENTER]";
  if (!result) return;   // the hero is deciding: the keys line lists 1..n
  $("keys").textContent = hs && hs.pending ? "> All-in: keys 1-2 fold or call. The reply to an all-in is not stored, so this decision gets no grade."
    : busy ? "> The hand goes on..."
    : cont ? "> ENTER: continue the hand. N: new spot."
    : hs && hs.over ? "> Hand over. ENTER or N for the next hand."
    : "> Press ENTER or SPACE for the next hand.";
}
async function continueHand() {
  if (!canContinue()) return;
  if (document.activeElement) document.activeElement.blur();
  const g = gen;
  busy = true; setButtons();
  try { await act(g, hs.heroP, result.i, spot.node.actions[result.i]); }
  catch (e) { if (g === gen) endHand([`<span class="err">&gt; ${esc(e.message)}</span>`, `&gt; ${NOT_STORED}.`]); }
  if (g !== gen) return;
  busy = false; setButtons();
}
// Player p takes action idx (label from the node) at hs.path.
async function act(g, p, idx, label) {
  const x = parseAct(label);
  const toCall = Math.max(0, hs.contrib[1 - p] - hs.contrib[p]);
  const d = describe(x.kind, x.amt, hs.pot, toCall, hs.put[p]);
  const facingAllin = hs.allin;
  hs.contrib[p] += x.amt; hs.pot += x.amt; hs.put[p] += x.amt;
  hs.path = joinPath(hs.path, idx);
  logAct(`${hs.name(p)} ${d.verb}`);
  if (x.kind === "Fold") { if (p !== hs.heroP) hs.vFolded = true; return endFold(p); }
  if (x.kind === "All-in") hs.allin = true;
  if (x.kind === "Call") return (facingAllin || hsBehind(0) < 0.01 || hsBehind(1) < 0.01) ? runout(g) : streetEnd(g);
  if (x.kind === "Check" && p === 1) return streetEnd(g);
  return nextNode(g);   // OOP check, bet, raise, all-in: the other player acts
}
async function getNode(path) {
  const r = await fetch(`/api/play/node?solve=${encodeURIComponent(hs.solve)}&path=${encodeURIComponent(path)}`, { cache: "no-store" });
  if (r.status === 404) return null;
  const j = await r.json();
  if (!r.ok || j.error) throw new Error(j.error || "server error " + r.status);
  return j;
}
async function nextNode(g) {
  const env = await getNode(hs.path);
  if (g !== gen) return;
  if (!env || !env.node || env.node.type !== "action" || !env.node.hands) return hs.allin ? assumeCall(g) : endHand([`&gt; ${cap(NOT_STORED)}.`]);
  const n = env.node;
  if (Math.abs(n.pot - hs.pot) > 0.02) console.warn("pot mismatch", hs.path, n.pot, hs.pot);
  hs.pot = n.pot; hs.contrib = n.contrib.slice();
  if (n.player === hs.heroP) return heroTurn(env);
  await sleep(STEP_MS);
  if (g !== gen) return;
  // Villain: its own hand's GTO mix; the range mix if its hand is not stored here (tiny weight).
  const mine = n.hands.find(h => comboKey(h.c) === comboKey(hs.V));
  const k = pickWeighted(n.actions.map((a, i) => i), i => (mine ? mine.s : n.freq)[i]);
  if (hs.vr) hs.vr = rangeAfterVillain(n, k == null ? 0 : k);
  return act(g, n.player, k == null ? 0 : k, n.actions[k == null ? 0 : k]);
}
// The reply to an all-in is not stored. The hero chooses (no grade); the villain is played as a call.
async function assumeCall(g) {
  const p = hs.contrib[0] < hs.contrib[1] ? 0 : 1;
  const amt = Math.min(hs.contrib[1 - p] - hs.contrib[p], Math.max(0, hsBehind(p)));
  if (p === hs.heroP) return heroFacesAllin(g, amt);
  hs.assumed = true;
  hs.contrib[p] += amt; hs.pot += amt; hs.put[p] += amt;
  logAct(`${hs.name(p)} calls ${bb(amt)} bb (reply to the all-in not stored: call assumed)`);
  return runout(g);
}
function heroFacesAllin(g, amt) {
  hs.pending = { g, amt };
  busy = false;
  $("acts").innerHTML = `<button class="btn" data-i="0"><span class="k">1</span> FOLD</button><button class="btn" data-i="1"><span class="k">2</span> CALL ${bb(amt)} bb</button>`;
  $("acts").querySelectorAll(".btn").forEach(b => b.onclick = () => allinReply(+b.dataset.i));
  $("actbox").scrollIntoView({ block: "nearest", behavior: "smooth" });
}
async function allinReply(i) {
  const pend = hs && hs.pending;
  if (!pend || pend.g !== gen) return;
  if (document.activeElement) document.activeElement.blur();
  hs.pending = null;
  $("acts").querySelectorAll(".btn").forEach(b => { b.disabled = true; b.classList.toggle("sel", +b.dataset.i === i); });
  const p = hs.heroP;
  if (i === 0) { logAct(`${hs.name(p)} folds (not stored: no grade)`); return endFold(p); }
  hs.contrib[p] += pend.amt; hs.pot += pend.amt; hs.put[p] += pend.amt;
  logAct(`${hs.name(p)} calls ${bb(pend.amt)} bb (not stored: no grade)`);
  busy = true; setButtons();
  await runout(pend.g);
  if (pend.g === gen) { busy = false; setButtons(); }
}
function heroTurn(env) {
  const n = env.node;
  const h = n.hands.find(x => comboKey(x.c) === comboKey(hs.H));
  if (!h) return endHand([`&gt; Your hand is not in the stored range at this point: ${NOT_STORED}.`]);
  if (hs.vr && Array.isArray(n.opp)) hs.vr = liveRange(n.opp, cardsOf(hs.H).concat(hs.board));
  spot = env; ctx = buildContext(env); hand = h; result = null;
  hs.put = ctx.put.slice();
  if (env.id != null) { recent = recent.filter(id => id !== env.id).concat([env.id]).slice(-RECENT_MAX); lsSet(LS_RECENT, recent); }
  $("answer").classList.add("hide");
  busy = false;
  render();
  $("tablebox").scrollIntoView({ block: "start", behavior: "smooth" });
}
// The betting on this street is over: showdown on the river, else deal the next stored card.
async function streetEnd(g) {
  if (hs.board.length >= 5) return showdown(g);
  const next = hs.board.length === 3 ? "turn" : "river";
  const r = await fetchJson(`/api/play/cards?solve=${encodeURIComponent(hs.solve)}&path=${encodeURIComponent(hs.path)}`);
  if (g !== gen) return;
  const dead = new Set(cardsOf(hs.H + hs.V).concat(hs.board));
  const cards = (r.cards || []).filter(c => !dead.has(c));
  if (!cards.length) return endHand([`&gt; The ${next} is not stored for this line: hand ends here.`]);
  await sleep(STEP_MS);
  if (g !== gen) return;
  const card = cards[Math.floor(Math.random() * cards.length)];
  hs.board.push(card); hs.street = next; hs.put = [0, 0]; hs.allin = false;
  if (hs.vr) hs.vr = liveRange(hs.vr, [card]);
  hs.path = joinPath(hs.path, card);
  hs.log.push({ title: streetTitle(next, hs.board), acts: [] });
  hs.last = `${cap(next)}: ${card}`;
  renderLog(); renderLive();
  return nextNode(g);
}
// All-in and called: deal the rest of the board at random, then show down.
async function runout(g) {
  const dead = new Set(cardsOf(hs.H + hs.V).concat(hs.board));
  const deck = [];
  for (const r of "23456789TJQKA") for (const s of "cdhs") if (!dead.has(r + s)) deck.push(r + s);
  while (hs.board.length < 5) {
    await sleep(STEP_MS);
    if (g !== gen) return;
    const card = deck.splice(Math.floor(Math.random() * deck.length), 1)[0];
    hs.board.push(card);
    if (hs.vr) hs.vr = liveRange(hs.vr, [card]);
    hs.street = hs.board.length === 4 ? "turn" : "river";
    hs.put = [0, 0];
    hs.log.push({ title: streetTitle(hs.street, hs.board) + " (run out)", acts: [] });
    hs.last = `${cap(hs.street)}: ${card}`;
    renderLog(); renderLive();
  }
  return showdown(g);
}
async function showdown(g) {
  const r = await fetchJson(`/api/play/showdown?board=${hs.board.join("")}&a=${hs.H}&b=${hs.V}`);
  if (g !== gen) return;
  if (!r || r.error || !r.winner) return endHand([`<span class="err">&gt; Showdown failed: ${esc((r && r.error) || "no answer")}</span>`]);
  const hero = hs.heroP, vil = 1 - hero, N = hs.name;
  const lines = [`&gt; Showdown: ${esc(N(hero))} ${suitText(hs.H)} (${esc(r.a)}) vs ${esc(N(vil))} ${suitText(hs.V)} (${esc(r.b)}).`];
  let heroWin;
  if (r.winner === "tie") { heroWin = hs.pot / 2; lines.push(`&gt; Split pot: ${bb(hs.pot / 2)} bb each.`); }
  else {
    const w = r.winner === "a" ? hero : vil;
    heroWin = w === hero ? hs.pot : 0;
    lines.push(`&gt; ${esc(N(w))} wins the pot of ${bb(hs.pot)} bb${w === hero ? " (YOU)" : ""}.`);
  }
  return endHand(lines, heroWin);
}
function endFold(folder) {
  const w = 1 - folder;
  const back = hs.contrib[w] - hs.contrib[folder];   // the bet that was not called goes back
  hs.contrib[w] -= back; hs.pot -= back; hs.put = [0, 0];
  const lines = [`&gt; ${esc(hs.name(folder))} folds. ${esc(hs.name(w))} wins the pot of ${bb(hs.pot)} bb${w === hs.heroP ? " (YOU)" : ""}` +
    (back > 0.005 ? `, ${bb(back)} bb not called goes back.` : ".")];
  return endHand(lines, w === hs.heroP ? hs.pot : 0);
}
// heroWin = chips the hero takes from the pot; undefined = no result (line not stored).
function endHand(lines, heroWin) {
  hs.over = true; busy = false;
  session.hands = (session.hands || 0) + 1;
  lsSet(LS_SESSION, session); renderStats();
  const vil = 1 - hs.heroP;
  if (hs.V && !lines.some(l => l.startsWith("&gt; Showdown:"))) lines.push(`&gt; ${esc(hs.name(vil))} had ${suitText(hs.V)}.`);
  if (heroWin !== undefined) {
    const net = hsBehind(hs.heroP) + heroWin - (hs.stack0 + hs.pot0 / 2);
    lines.push(`&gt; Your result in this hand: ${net >= 0 ? "+" : ""}${bb(net)} bb.`);
  }
  // Summary of the hero's decisions in this hand.
  const ds = hs.decisions;
  const good = ds.filter(d => GOOD_GRADES.includes(d.grade)).length;
  const w = Math.max(10, ...ds.map(d => d.act.length + 1));
  lines.push("", "HAND SUMMARY");
  ds.forEach((d, k) => {
    const cls = GOOD_GRADES.includes(d.grade) ? "good" : d.grade === "INACCURACY" ? "" : "err";
    lines.push(`${String(k + 1).padStart(2)}. ${(d.street || "").toUpperCase().padEnd(6)}${esc(d.act.padEnd(w))}<span class="${cls}">${d.grade.padEnd(11)}</span>loss ${bb(d.loss)} bb`);
  });
  lines.push(`DECISIONS ${ds.length} · GOOD ${good}/${ds.length} · EV LOST ${bb(hs.evLost)} bb`);
  hs.endLines = lines;
  renderLog(); renderLive(); setButtons();
  $("logbox").scrollIntoView({ block: "nearest", behavior: "smooth" });
  // After the real hand: the villain's whole range for this line (it comes from the server, so it is added when ready).
  if (hs.vr) {
    const me = hs;
    rangeLines(me).then(extra => {
      if (hs !== me || !me.endLines) return;   // a new hand started meanwhile
      const i = me.endLines.indexOf("HAND SUMMARY");
      me.endLines.splice(i > 0 ? i - 1 : me.endLines.length, 0, ...extra);
      renderLog();
    });
  }
}
function logAct(text) {
  hs.log[hs.log.length - 1].acts.push(text);
  hs.last = text;
  renderLog(); renderLive();
}
// The table while the hand runs between hero decisions (and at the end, with the villain's cards up).
function renderLive() {
  if (!hs || !$("felt")) return;
  $("felt").innerHTML = feltHtml({ hero: hs.heroP, name: hs.name, behind: hsBehind, put: hs.put, board: hs.board, pot: hs.pot,
    heroCards: hs.H, oppCards: hs.over ? hs.V : null });
  if (hs.last) $("lastLine").innerHTML = `<div class="last">&gt; ${suitText(esc(hs.last))}</div>`;
}
function renderLog() {
  // Older rows have no opponent range (node.opp): one decision only, no log.
  if (!hs || !hs.V) { $("logbox").classList.add("hide"); return; }
  $("logbox").classList.remove("hide");
  const N = hs.name, vil = 1 - hs.heroP;
  let t = `&gt; You (${esc(N(hs.heroP))}): ${suitText(hs.H)}   ${esc(N(vil))}: ${hs.over ? suitText(hs.V) : "hidden"}\n`;
  if (hs.oppNote) t += `<span class="dim">&gt; Note: ${esc(hs.oppNote)}.</span>\n`;
  t += hs.log.map(e => suitText(esc(`${e.title}: ${e.acts.length ? e.acts.join(", ") : "-"}`))).join("\n");
  $("log").innerHTML = t;
  $("handEnd").innerHTML = hs.endLines ? hs.endLines.join("\n") + `\n<button class="btn" id="next2">NEXT HAND <span class="k">[ENTER]</span></button>` : "";
  if ($("next2")) $("next2").onclick = loadSpot;
}

// ===== Session panel =====
function renderStats() {
  const s = session;
  const acc = s.played ? (100 * s.good / s.played).toFixed(0) + "%" : "-";
  let t = `DECISIONS ${s.played}\nHANDS     ${s.hands || 0} played out\nACCURACY  ${acc}\nEV LOST   ${bb(s.evLost)} bb\n`;
  if (s.played) t += `AVG LOSS  ${bb(s.evLost / s.played)} bb/decision\n`;
  const cats = Object.entries(s.cats);
  if (cats.length) t += "\nBY CATEGORY\n" + cats.map(([k, v]) => `${k.replace("_", " ").toUpperCase().padEnd(12)}${String(v.good).padStart(3)}/${v.n}`).join("\n") + "\n";
  const gs = ["BEST", "CORRECT", "INACCURACY", "MISTAKE", "BLUNDER"].filter(g => s.grades[g]);
  if (gs.length) t += "\nGRADES\n" + gs.map(g => `${g.padEnd(12)}${String(s.grades[g]).padStart(3)}`).join("\n");
  $("stats").textContent = t;
}
$("reset").onclick = () => { session = newSession(); lsSet(LS_SESSION, session); renderStats(); };
$("legend").textContent =
  `BEST        GTO freq >= ${GRADE.BEST.freq * 100}%\n            or loss < ${GRADE.BEST.loss}% pot\n` +
  `CORRECT     freq >= ${GRADE.CORRECT.freq * 100}%\n            or loss < ${GRADE.CORRECT.loss}% pot\n` +
  `INACCURACY  loss < ${GRADE.INACCURACY.loss}% pot\nMISTAKE     loss < ${GRADE.MISTAKE.loss}% pot\nBLUNDER     loss >= ${GRADE.MISTAKE.loss}% pot\n\n` +
  `Accuracy = BEST + CORRECT.\nEV = bb won from the pot\nfrom this point.`;

// ===== Category filter =====
function renderCats() {
  $("cats").innerHTML = CATEGORIES.map(([k, l]) => `<button class="btn small${k === cat ? " sel" : ""}" data-c="${k}">${l}</button>`).join("");
  $("cats").querySelectorAll(".btn").forEach(b => b.onclick = () => { cat = b.dataset.c; lsSet(LS_CAT, cat); renderCats(); loadSpot(); });
}

// ===== Keys =====
$("next").onclick = loadSpot;
$("cont").onclick = continueHand;
addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (intro) { e.preventDefault(); stopIntro(); return; }   // first key only skips the replay
  if (hs && hs.pending) {
    if (e.key === "1" || e.key === "2") { e.preventDefault(); allinReply(+e.key - 1); return; }
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); return; }
  }
  if (result && busy) { if (e.key === "Enter" || e.key === " ") e.preventDefault(); if (e.key === "n" || e.key === "N") loadSpot(); return; }
  if (result && canContinue()) {
    if (e.key === "Enter" || e.key === " " || e.key === "c" || e.key === "C") { e.preventDefault(); continueHand(); return; }
    if (e.key === "n" || e.key === "N") { e.preventDefault(); loadSpot(); return; }
  }
  if (result && (e.key === "Enter" || e.key === " " || e.key === "n" || e.key === "N")) { e.preventDefault(); loadSpot(); return; }
  if (!result && spot && /^[1-9]$/.test(e.key)) {
    const i = +e.key - 1;
    if (i < spot.node.actions.length) { e.preventDefault(); choose(i); }
  }
  if (!spot && e.key === "Enter" && $("retry")) { e.preventDefault(); loadSpot(); }
});
let rz = null;
addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(renderAnswer, 120); });

renderCats();
renderStats();
loadStats();
loadSpot();
</script>
