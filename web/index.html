<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poker Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  :root { --fg:#fff; --bg:#000; --dim:#888; --red:#ff2a2a; --grn:#3ddc5a; --blu:#3fa9f5; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:"VT323", ui-monospace, Menlo, monospace; font-size:21px; line-height:1.15; }
  .wrap { max-width:1240px; margin:0 auto; padding:18px 16px 40px; }
  /* Panels: thin double-line frame with a title cut into the top edge. */
  .box { border:3px double var(--fg); padding:16px 16px 12px; margin:14px 0 16px; position:relative; }
  .box[data-t]::before { content:"[ " attr(data-t) " ]"; position:absolute; top:-13px; left:12px; background:var(--bg); padding:0 6px; color:var(--dim); font-size:19px; line-height:22px; }
  h1 { font-size:34px; margin:0; letter-spacing:2px; font-weight:normal; }
  .sub { color:var(--dim); }
  .grid2 { display:grid; grid-template-columns: 380px 1fr; gap:16px; align-items:start; }
  @media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }
  label { display:block; margin-top:8px; color:var(--dim); }
  input, textarea { width:100%; background:#000; color:#fff; border:1px solid #666; font:inherit; padding:3px 6px; }
  textarea { height:74px; resize:vertical; font-size:18px; }
  input:focus, textarea:focus { outline:none; border-color:#fff; }
  .row { display:flex; gap:8px; } .row > div { flex:1; }
  /* Buttons: outlined; hover/selected inverts the colors (like a terminal selection). */
  .btn { --c:#fff; background:#000; color:var(--c); border:2px solid var(--c); font:inherit; font-size:24px; padding:1px 14px; cursor:pointer; margin:8px 8px 0 0; }
  .btn:hover, .btn.sel { background:var(--c); color:#000; }
  .btn.small { font-size:20px; padding:0 10px; }
  .dialog { min-height:64px; white-space:pre-wrap; }
  .dialog::after { content:"_"; animation:blink 1s steps(1) infinite; }
  .dialog:empty::after, #nodeHead::after { content:none; }
  @keyframes blink { 50% { opacity:0; } }
  .err { color:var(--red); }
  .bars { white-space:pre; font-size:21px; }
  .crumbs { color:var(--dim); margin-bottom:6px; }
  .crumbs span { color:#fff; }
  .acts { display:flex; flex-wrap:wrap; }
  .cards { display:grid; grid-template-columns: repeat(13, 44px); gap:5px; margin-top:6px; }
  .card { border:2px solid #fff; text-align:center; cursor:pointer; padding:1px 0; }
  .card:hover { background:#fff; color:#000; }
  .s-h, .s-d { color:var(--red); }
  table.rg { border-collapse:collapse; user-select:none; }
  table.rg td { width:44px; height:30px; border:1px solid #222; text-align:center; font-size:17px; cursor:default; position:relative; padding:0; }
  table.rg td.off { color:#333; }
  table.rg td:hover { outline:2px solid #fff; z-index:2; }
  table.rg td span { position:relative; text-shadow:0 0 2px #000, 0 0 2px #000; }
  .detail { white-space:pre; font-size:19px; min-height:160px; overflow-x:auto; }
  .legend span { margin-right:14px; }
  .sw { display:inline-block; width:14px; height:14px; margin-right:4px; vertical-align:-1px; }
  .flex { display:flex; gap:16px; flex-wrap:wrap; align-items:flex-start; }
  .hide { display:none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="box">
    <h1>POKER LAB</h1>
    <div class="dialog" id="intro"></div>
  </div>

  <div class="grid2">
    <div class="box" data-t="spot">
      <div class="presets">
        <button class="btn small" data-preset="river">RIVER</button>
        <button class="btn small" data-preset="turn">TURN</button>
        <button class="btn small" data-preset="toy">TOY</button>
      </div>
      <form id="spot">
        <label>Board</label><input name="board">
        <div class="row">
          <div><label>Pot</label><input name="pot"></div>
          <div><label>Stack</label><input name="stack"></div>
        </div>
        <label>OOP range (acts first)</label><textarea name="oop"></textarea>
        <label>IP range</label><textarea name="ip"></textarea>
        <div class="row">
          <div><label>Bets % pot</label><input name="bets"></div>
          <div><label>Raises %</label><input name="raises"></div>
        </div>
        <div class="row">
          <div><label>Target % pot</label><input name="target"></div>
          <div><label>Max iters</label><input name="iters"></div>
        </div>
        <input type="hidden" name="ip_bets">
        <input type="hidden" name="max_raises">
        <input type="hidden" name="allin">
        <button class="btn" type="submit" id="go">SOLVE</button>
        <button class="btn" type="button" id="stop">STOP</button>
      </form>
    </div>

    <div>
      <div class="box" data-t="solver">
        <div class="dialog" id="status">&gt; Choose a spot. Then press SOLVE.</div>
        <div class="bars" id="progress"></div>
      </div>
      <div class="box hide" id="result" data-t="strategy">
        <div class="crumbs" id="crumbs"></div>
        <div id="nodeHead" class="dialog"></div>
        <div class="acts" id="acts"></div>
        <div class="bars" id="freq" style="margin-top:10px"></div>
        <div class="flex" style="margin-top:12px">
          <table class="rg" id="rg"></table>
          <div style="flex:1; min-width:300px">
            <div class="legend" id="legend"></div>
            <div class="detail" id="detail">&gt; Point at a cell to see its hands.</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const PRESETS = {
  river: { board:"Ks 9d 5c 2h 2d", pot:10, stack:95,
    oop:"TT-22,AJs-A2s,KTs+,K9s-K6s,QTs+,Q9s,J9s+,T8s+,97s+,86s+,75s+,64s+,54s,AJo-A8o,KTo+,QTo+,JTo",
    ip:"AA-22,A2s+,K7s+,Q8s+,J8s+,T8s+,97s+,86s+,76s,65s,A8o+,KTo+,QTo+,JTo",
    bets:"33,75", raises:"60", target:0.3, iters:1000, ip_bets:"", max_raises:3, allin:1 },
  turn: { board:"Ks 9d 5c 2h", pot:10, stack:95,
    oop:"TT-22,AJs-A2s,KTs+,K9s-K6s,QTs+,Q9s,J9s+,T8s+,97s+,86s+,75s+,64s+,54s,AJo-A8o,KTo+,QTo+,JTo",
    ip:"AA-22,A2s+,K7s+,Q8s+,J8s+,T8s+,97s+,86s+,76s,65s,A8o+,KTo+,QTo+,JTo",
    bets:"33,75", raises:"60", target:0.5, iters:600, ip_bets:"", max_raises:3, allin:1 },
  toy: { board:"Ks Qd 7h 4c 2d", pot:10, stack:100, oop:"77,65s", ip:"QJs",
    bets:"100", raises:"none", target:0.05, iters:3000, ip_bets:"none", max_raises:0, allin:0 },
};
const $ = id => document.getElementById(id);
const form = $("spot");
let path = [], polling = null, lastNode = null;

// Status text appears at once; a blinking "_" cursor (CSS) follows it.
function typeText(el, text) { el.textContent = text; }
function setPreset(name) {
  const p = PRESETS[name];
  for (const [k, v] of Object.entries(p)) if (form.elements[k]) form.elements[k].value = v;
  document.querySelectorAll("[data-preset]").forEach(b => b.classList.toggle("sel", b.dataset.preset === name));
}
document.querySelectorAll("[data-preset]").forEach(b => b.onclick = () => setPreset(b.dataset.preset));
setPreset("river");
typeText($("intro"), "> Heads-up solver.");

function bar(frac, width = 24) {
  const n = Math.max(0, Math.min(width, Math.round(frac * width)));
  return "█".repeat(n) + "░".repeat(width - n);
}
// 4-row ASCII chart of exploitability (log scale), newest point on the right.
function chart(hist, target) {
  if (!hist.length) return "";
  const pts = hist.slice(-48).map(h => Math.log10(Math.max(h[1], 1e-3)));
  const hi = Math.max(...pts), lo = Math.min(...pts, Math.log10(target));
  const rows = 4, lines = [];
  for (let r = rows; r >= 1; r--) {
    const label = r === rows ? (10 ** hi).toFixed(2).padStart(6) + "% " : r === 1 ? (10 ** lo).toFixed(2).padStart(6) + "% " : "        ";
    lines.push(label + "|" + pts.map(v => ((v - lo) / Math.max(hi - lo, 1e-9)) * rows >= r - 0.5 ? "█" : " ").join(""));
  }
  lines.push("        +" + "-".repeat(pts.length) + " iterations");
  return lines.join("\n");
}

form.onsubmit = async (e) => {
  e.preventDefault();
  const body = new URLSearchParams(new FormData(form));
  for (const [k, v] of [...body]) if (v === "") body.delete(k);
  $("result").classList.add("hide");
  const r = await fetch("/api/solve", { method:"POST", body });
  const j = await r.json();
  if (!j.ok) { $("status").innerHTML = '<span class="err">> ' + esc(j.error) + "</span>"; return; }
  typeText($("status"), "> The solver is thinking...");
  path = [];
  clearInterval(polling);
  polling = setInterval(poll, 250);
};
$("stop").onclick = () => fetch("/api/stop", { method:"POST" });

async function poll() {
  const s = await (await fetch("/api/status")).json();
  if (s.state === "error") { clearInterval(polling); $("status").innerHTML = '<span class="err">> ' + esc(s.error) + "</span>"; $("progress").textContent = ""; return; }
  const e = s.expl_pct < 0 ? "..." : s.expl_pct.toFixed(3) + "%";
  const goal = s.expl_pct < 0 ? 0 : Math.min(1, Math.log10(Math.max(s.expl_pct, 1e-4) / 100) / Math.log10(s.target_pct / 100));
  $("progress").textContent =
    `ITER ${String(s.iteration).padStart(5)} / ${s.max_iters}   ${s.seconds.toFixed(1)} s\n` +
    `EXPLOITABILITY ${bar(Math.max(0, goal))} ${e} of pot (goal ${s.target_pct}%)\n\n` +
    chart(s.history, s.target_pct);
  if (s.state === "done") {
    clearInterval(polling);
    const ok = s.expl_pct <= s.target_pct;
    typeText($("status"), (ok ? "> The solve converged." : "> The solve stopped before the goal.") +
      `\n> ${s.hands[0]} vs ${s.hands[1]} combos. ${s.nodes} nodes. ${s.memory_mb.toFixed(1)} MB.` +
      `\n> EV: OOP ${s.ev[0].toFixed(2)}  IP ${s.ev[1].toFixed(2)} (of a ${s.pot} pot).`);
    loadNode();
  }
}

const ACT_COLORS = { Fold:"#3fa9f5", Check:"#3ddc5a", Call:"#3ddc5a" };
const BET_COLORS = ["#ffd400", "#ff8c1a", "#ff4d2a", "#d0103a", "#9c0a7a"];
function colorsFor(actions) {
  let b = 0;
  return actions.map(a => { const k = a.split(" ")[0]; if (ACT_COLORS[k]) return ACT_COLORS[k]; return k === "All-in" ? "#b44dff" : BET_COLORS[Math.min(b++, BET_COLORS.length - 1)]; });
}
function esc(s) { return String(s).replace(/[&<>]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;" }[c])); }
function suitHtml(cards) { return cards.replace(/([2-9TJQKA])([cdhs])/g, (m, r, s) => `<span class="s-${s}">${r}${({c:"♣",d:"♦",h:"♥",s:"♠"})[s]}</span>`); }

async function loadNode() {
  const r = await fetch("/api/node?path=" + encodeURIComponent(path.join(",")));
  const n = await r.json();
  if (n.error) { $("status").innerHTML = '<span class="err">> ' + esc(n.error) + "</span>"; return; }
  lastNode = n;
  $("result").classList.remove("hide");
  const back = path.length ? ' <button class="btn small" id="back">BACK</button> <button class="btn small" id="root">ROOT</button>' : "";
  $("crumbs").innerHTML = "ROOT" + (n.history.length ? " > " + n.history.map(h => "<span>" + esc(h) + "</span>").join(" > ") : "") + back;
  if (path.length) { $("back").onclick = () => { path.pop(); loadNode(); }; $("root").onclick = () => { path = []; loadNode(); }; }
  const head = `> Board ${suitHtml(n.board)}   Pot ${n.pot}`;
  $("acts").innerHTML = ""; $("freq").textContent = ""; $("rg").innerHTML = ""; $("legend").innerHTML = "";
  $("detail").textContent = n.type === "action" ? "> Point at a cell to see its hands." : "";
  if (n.type === "fold") { $("nodeHead").innerHTML = head + `\n> ${n.winner ? "IP" : "OOP"} wins the pot. The hand ends.`; return; }
  if (n.type === "showdown") { $("nodeHead").innerHTML = head + "\n> Showdown. The hand ends."; return; }
  if (n.type === "chance") {
    $("nodeHead").innerHTML = head + "\n> Choose the next card.";
    const order = "AKQJT98765432";
    const cards = n.cards.slice().sort((a, b) => order.indexOf(a[0]) - order.indexOf(b[0]) || "shdc".indexOf(a[1]) - "shdc".indexOf(b[1]));
    $("acts").innerHTML = '<div class="cards">' + cards.map(c => `<div class="card" data-c="${c}">${suitHtml(c)}</div>`).join("") + "</div>";
    document.querySelectorAll(".card").forEach(el => el.onclick = () => { path.push(el.dataset.c); loadNode(); });
    return;
  }
  const who = n.player === 0 ? "OOP" : "IP";
  $("nodeHead").innerHTML = head + `\n> ${who} to act. ${n.combos.toFixed(1)} combos reach here.`;
  const cols = colorsFor(n.actions);
  $("acts").innerHTML = n.actions.map((a, i) => `<button class="btn" data-i="${i}" style="--c:${cols[i]}">${esc(a.toUpperCase())}</button>`).join("");
  document.querySelectorAll("#acts .btn").forEach(b => b.onclick = () => { path.push(b.dataset.i); loadNode(); });
  const w = Math.max(...n.actions.map(a => a.length));
  $("freq").innerHTML = n.actions.map((a, i) => `<span style="color:${cols[i]}">${esc(a.padEnd(w))}  ${bar(n.freq[i], 30)} ${(n.freq[i] * 100).toFixed(1).padStart(5)}%</span>`).join("\n");
  $("legend").innerHTML = n.actions.map((a, i) => `<span><i class="sw" style="background:${cols[i]}"></i>${esc(a)}</span>`).join("");
  const maxW = Math.max(...n.grid.map(c => c.w), 1e-9);
  let html = "";
  for (let r = 0; r < 13; r++) {
    html += "<tr>";
    for (let c = 0; c < 13; c++) {
      const cell = n.grid[r * 13 + c];
      if (!cell.s) { html += `<td class="off">${cell.l}</td>`; continue; }
      let acc = 0; const stops = [];
      cell.s.forEach((f, i) => { stops.push(`${cols[i]} ${acc * 100}%`); acc += f; stops.push(`${cols[i]} ${acc * 100}%`); });
      const h = Math.max(15, Math.round(100 * cell.w / maxW));
      html += `<td data-k="${r * 13 + c}" style="background:linear-gradient(to right, ${stops.join(",")}) bottom / 100% ${h}% no-repeat"><span>${cell.l}</span></td>`;
    }
    html += "</tr>";
  }
  $("rg").innerHTML = html;
  document.querySelectorAll("#rg td[data-k]").forEach(td => td.onmouseenter = () => showCell(+td.dataset.k));
}

function showCell(k) {
  const n = lastNode, cell = n.grid[k], cols = colorsFor(n.actions);
  const hands = n.hands.filter(h => labelOf(h.c) === cell.l);
  const short = n.actions.map(a => a.split(" ")[0].slice(0, 5).toUpperCase() + (a.includes(" ") ? a.split(" ")[1] : "").slice(0, 4));
  let out = `${cell.l}   ${cell.w.toFixed(2)} combos   EV ${cell.ev.toFixed(2)}\n\n`;
  out += "HAND   " + short.map(s => s.padStart(8)).join("") + "     EV\n";
  for (const h of hands) {
    out += h.c.padEnd(7) + h.s.map(f => ((f * 100).toFixed(0) + "%").padStart(8)).join("") + h.e.toFixed(2).padStart(7) + "\n";
  }
  out += "\nEV BY ACTION\n";
  for (const h of hands) out += h.c.padEnd(7) + h.ev.map(v => v.toFixed(2).padStart(8)).join("") + "\n";
  $("detail").textContent = out;
}
function labelOf(c) {
  const R = "AKQJT98765432";
  const a = c[0], b = c[2];
  if (a === b) return a + b;
  const [hi, lo] = R.indexOf(a) < R.indexOf(b) ? [a, b] : [b, a];
  return hi + lo + (c[1] === c[3] ? "s" : "o");
}
</script>
</body>
</html>
